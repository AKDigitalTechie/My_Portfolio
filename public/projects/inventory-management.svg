<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" role="img" aria-label="Inventory management table with stock levels and boxes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#151A33"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F8CFF"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
  </defs>
  <rect width="480" height="240" fill="url(#bg)"/>

  <!-- table card -->
  <rect x="20" y="20" width="292" height="200" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/>
  <rect x="34" y="32" width="90" height="10" rx="5" fill="#ffffff" fill-opacity="0.45"/>
  <rect x="236" y="28" width="62" height="18" rx="9" fill="url(#acc)"/>
  <text x="267" y="41" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#fff">+ Add Item</text>

  <rect x="34" y="56" width="264" height="20" rx="6" fill="#ffffff" fill-opacity="0.08"/>
  <text x="44" y="70" font-family="Arial, sans-serif" font-size="9" fill="#94A3B8">SKU</text>
  <text x="104" y="70" font-family="Arial, sans-serif" font-size="9" fill="#94A3B8">Item</text>
  <text x="196" y="70" font-family="Arial, sans-serif" font-size="9" fill="#94A3B8">Qty</text>
  <text x="240" y="70" font-family="Arial, sans-serif" font-size="9" fill="#94A3B8">Status</text>

  <g font-family="Arial, sans-serif" font-size="10" fill="#E2E8F0">
    <text x="44" y="98">A-1042</text><text x="104" y="98">Router X2</text><text x="196" y="98">240</text>
    <rect x="236" y="88" width="52" height="14" rx="7" fill="#34D399" fill-opacity="0.18"/>
    <text x="262" y="98" text-anchor="middle" font-size="8" fill="#34D399">In stock</text>

    <text x="44" y="124">A-1187</text><text x="104" y="124">Sensor T9</text><text x="196" y="124">18</text>
    <rect x="236" y="114" width="52" height="14" rx="7" fill="#FBBF24" fill-opacity="0.18"/>
    <text x="262" y="124" text-anchor="middle" font-size="8" fill="#FBBF24">Low</text>

    <text x="44" y="150">B-2231</text><text x="104" y="150">Switch S4</text><text x="196" y="150">96</text>
    <rect x="236" y="140" width="52" height="14" rx="7" fill="#34D399" fill-opacity="0.18"/>
    <text x="262" y="150" text-anchor="middle" font-size="8" fill="#34D399">In stock</text>

    <text x="44" y="176">C-3310</text><text x="104" y="176">Cable K7</text><text x="196" y="176">0</text>
    <rect x="236" y="166" width="52" height="14" rx="7" fill="#F87171" fill-opacity="0.18"/>
    <text x="262" y="176" text-anchor="middle" font-size="8" fill="#F87171">Out</text>

    <text x="44" y="202">C-3412</text><text x="104" y="202">Panel P1</text><text x="196" y="202">57</text>
    <rect x="236" y="192" width="52" height="14" rx="7" fill="#34D399" fill-opacity="0.18"/>
    <text x="262" y="202" text-anchor="middle" font-size="8" fill="#34D399">In stock</text>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.06">
    <path d="M34 108H298M34 134H298M34 160H298M34 186H298"/>
  </g>

  <!-- stacked boxes -->
  <g stroke="#7FA8FF" stroke-width="2" stroke-linejoin="round" fill="#ffffff" fill-opacity="0.06">
    <path d="M360 170 L400 150 L440 170 L400 190 Z"/>
    <path d="M360 170 V212 L400 232 V190"/>
    <path d="M440 170 V212 L400 232"/>
    <path d="M380 118 L412 102 L444 118 L412 134 Z" stroke="#A855F7"/>
    <path d="M380 118 V150 L412 166 V134" stroke="#A855F7"/>
    <path d="M444 118 V150 L412 166" stroke="#A855F7"/>
  </g>
  <rect x="338" y="30" width="122" height="46" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="350" y="48" font-family="Arial, sans-serif" font-size="9" fill="#94A3B8">Total Items</text>
  <text x="350" y="68" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#F8FAFC">1,284</text>
</svg>
