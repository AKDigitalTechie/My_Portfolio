<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" role="img" aria-label="Flowchart builder canvas with connected nodes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#151A33"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F8CFF"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7FA8FF"/>
    </marker>
  </defs>
  <rect width="480" height="240" fill="url(#bg)"/>
  <rect width="480" height="240" fill="url(#dots)"/>

  <!-- toolbar -->
  <rect x="14" y="12" width="120" height="26" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/>
  <rect x="22" y="20" width="10" height="10" rx="2" fill="#4F8CFF"/>
  <circle cx="45" cy="25" r="5" fill="none" stroke="#A855F7" stroke-width="2"/>
  <path d="M60 31l5-12 5 12z" fill="none" stroke="#7FA8FF" stroke-width="2" stroke-linejoin="round"/>
  <rect x="82" y="22" width="44" height="6" rx="3" fill="#ffffff" fill-opacity="0.18"/>

  <!-- connectors -->
  <path d="M110 92 H150" stroke="#7FA8FF" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M232 92 H262" stroke="#7FA8FF" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M192 118 V160 H262" stroke="#7FA8FF" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M344 92 H372" stroke="#7FA8FF" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M344 160 H416 V118" stroke="#7FA8FF" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- start -->
  <rect x="36" y="76" width="74" height="32" rx="16" fill="url(#acc)"/>
  <text x="73" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">Start</text>

  <!-- decision -->
  <path d="M192 64 L232 92 L192 120 L152 92 Z" fill="#ffffff" fill-opacity="0.07" stroke="#A855F7" stroke-width="2"/>
  <text x="192" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E2E8F0">Valid?</text>

  <!-- process nodes -->
  <rect x="264" y="76" width="80" height="32" rx="8" fill="#ffffff" fill-opacity="0.07" stroke="#4F8CFF" stroke-width="2"/>
  <text x="304" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E2E8F0">Process</text>
  <rect x="264" y="144" width="80" height="32" rx="8" fill="#ffffff" fill-opacity="0.07" stroke="#4F8CFF" stroke-width="2"/>
  <text x="304" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E2E8F0">Review</text>

  <!-- end -->
  <rect x="374" y="76" width="74" height="32" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="url(#acc)" stroke-width="2"/>
  <text x="411" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">End</text>

  <text x="204" y="140" font-family="Arial, sans-serif" font-size="10" fill="#94A3B8">No</text>
  <text x="236" y="86" font-family="Arial, sans-serif" font-size="10" fill="#94A3B8">Yes</text>

  <!-- drag handle node -->
  <rect x="36" y="168" width="74" height="32" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-dasharray="5 4" stroke-width="1.5"/>
  <text x="73" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#94A3B8">+ drag node</text>
</svg>
