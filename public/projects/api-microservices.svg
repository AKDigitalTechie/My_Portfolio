<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" role="img" aria-label="API gateway connected to microservices and databases">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#151A33"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F8CFF"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="480" height="240" fill="url(#bg)"/>
  <rect width="480" height="240" fill="url(#dots)"/>

  <!-- connections -->
  <g stroke="#7FA8FF" stroke-opacity="0.7" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M86 120 H170"/>
    <path d="M250 110 L330 52"/>
    <path d="M250 120 H330"/>
    <path d="M250 130 L330 188"/>
    <path d="M394 52 H430"/>
    <path d="M394 120 H430"/>
    <path d="M394 188 H430"/>
  </g>

  <!-- client -->
  <rect x="22" y="92" width="64" height="56" rx="10" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.2"/>
  <rect x="32" y="102" width="44" height="26" rx="4" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="44" y="134" width="20" height="4" rx="2" fill="#94A3B8"/>
  <text x="54" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#94A3B8">Client</text>

  <!-- gateway -->
  <rect x="170" y="86" width="80" height="68" rx="14" fill="url(#acc)"/>
  <text x="210" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">API</text>
  <text x="210" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">Gateway</text>

  <!-- services -->
  <g font-family="Arial, sans-serif" font-size="10" fill="#E2E8F0" text-anchor="middle">
    <rect x="330" y="32" width="64" height="40" rx="10" fill="#ffffff" fill-opacity="0.07" stroke="#4F8CFF" stroke-width="2"/>
    <text x="362" y="48">Auth</text><text x="362" y="62" font-size="8" fill="#94A3B8">service</text>
    <rect x="330" y="100" width="64" height="40" rx="10" fill="#ffffff" fill-opacity="0.07" stroke="#A855F7" stroke-width="2"/>
    <text x="362" y="116">Hierarchy</text><text x="362" y="130" font-size="8" fill="#94A3B8">service</text>
    <rect x="330" y="168" width="64" height="40" rx="10" fill="#ffffff" fill-opacity="0.07" stroke="#4F8CFF" stroke-width="2"/>
    <text x="362" y="184">Reports</text><text x="362" y="198" font-size="8" fill="#94A3B8">service</text>
  </g>

  <!-- databases -->
  <g stroke="#7FA8FF" stroke-width="1.8" fill="#ffffff" fill-opacity="0.06">
    <ellipse cx="445" cy="44" rx="14" ry="5"/><path d="M431 44V60c0 3 6 5 14 5s14-2 14-5V44"/>
    <ellipse cx="445" cy="112" rx="14" ry="5"/><path d="M431 112V128c0 3 6 5 14 5s14-2 14-5V112"/>
    <ellipse cx="445" cy="180" rx="14" ry="5"/><path d="M431 180V196c0 3 6 5 14 5s14-2 14-5V180"/>
  </g>

  <!-- request pulses -->
  <circle cx="128" cy="120" r="4" fill="#A855F7"/>
  <circle cx="290" cy="81" r="4" fill="#4F8CFF"/>
  <circle cx="290" cy="120" r="4" fill="#A855F7"/>
  <circle cx="290" cy="159" r="4" fill="#4F8CFF"/>
</svg>
